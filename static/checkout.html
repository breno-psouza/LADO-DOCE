<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Lado Doce</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Trirong:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="checkout-page">

<header class="cabecalio checkoutHeader">
    <div class="btnsCabecalio">
        <div class="logoCheckout">
            <h1 class="logoLD logoCheckoutTitulo">LADO DOCE</h1>
        </div>

        <a href="index.html" class="botaoHover">
            <span>VOLTAR PARA A LOJA</span>
        </a>
    </div>
</header>

    <main class="checkout-wrapper">
        <section class="checkout-coluna">
            <div class="checkout-bloco">
                <h2>Identificação</h2>
                <div class="checkout-grid">
                    <label class="full">Nome completo
                        <input type="text" id="checkoutNome" placeholder="Seu nome completo">
                    </label>
                    <label>E-mail
                        <input type="email" id="checkoutEmail" placeholder="voce@email.com">
                    </label>
                    <label>Telefone
                        <input type="tel" id="checkoutTelefone" placeholder="(11) 99999-9999">
                    </label>
                </div>
            </div>

            <div class="checkout-bloco">
                <h2>Endereço de entrega</h2>
                <div class="checkout-grid">
                    <label>CEP
                        <input type="text" id="checkoutCep" placeholder="00000-000">
                    </label>
                    <label>Rua
                        <input type="text" id="checkoutRua" placeholder="Rua / Avenida">
                    </label>
                    <label>Número
                        <input type="text" id="checkoutNumero" placeholder="Número">
                    </label>
                    <label>Complemento
                        <input type="text" id="checkoutComplemento" placeholder="Apto, bloco, referência">
                    </label>
                    <label>Bairro
                        <input type="text" id="checkoutBairro" placeholder="Bairro">
                    </label>
                    <label>Cidade
                        <input type="text" id="checkoutCidade" placeholder="Cidade">
                    </label>
                    <label>Estado
                        <input type="text" id="checkoutEstado" placeholder="UF">
                    </label>
                </div>
            </div>

            <div class="checkout-bloco">
                <h2>Frete</h2>
                <!-- ⚠️ Deixar vazio — preenchido automaticamente pelo checkout.js ao digitar o CEP -->
                <div class="opcoes-frete" id="opcoesFrete">
                    <p style="color: #999;">Digite o CEP acima para calcular o frete.</p>
                </div>
            </div>


        </section>

        <aside class="checkout-resumo">
            <h2>Resumo da compra</h2>
            <div class="listaResumoCheckout" id="listaResumoCheckout"></div>
            <div class="linhaResumo">
                <span>Subtotal</span>
                <strong id="checkoutSubtotal">R$ 0,00</strong>
            </div>
            <div class="linhaResumo">
                <span>Frete</span>
                <strong id="checkoutFrete">—</strong>
            </div>
            <div class="linhaResumo totalResumo">
                <span>Total</span>
                <strong id="checkoutTotal">R$ 0,00</strong>
            </div>
            <button class="btnFinalizar btnPagar" id="confirmarPedido" type="button">Finalizar e Pagar!</button>
            <div class="mensagemCheckout" id="mensagemCheckout"></div>
        </aside>
    </main>

    <script src="checkout.js"></script>
</body>
</html>
